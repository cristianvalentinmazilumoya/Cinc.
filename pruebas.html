<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinc · Pruebas</title>
  <style>
    :root { --fondo: #F6F8FA; --texto: #16263D; --suave: #5B6878; --borde: #E1E7EE; --verde: #1E8A4C; --rojo: #C53030; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #0F1722; --texto: #E8EEF5; --suave: #9AA7B5; --borde: #263345; --verde: #4CC27E; --rojo: #F06C6C; }
    }
    body { margin: 0; background: var(--fondo); color: var(--texto); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; }
    p { color: var(--suave); }
    .resumen { font-weight: 700; font-size: 1.1rem; }
    .resumen.ok { color: var(--verde); }
    .resumen.falla { color: var(--rojo); }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--borde); }
    th { color: var(--suave); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
    tr.ok td:first-child { color: var(--verde); font-weight: 700; }
    tr.falla td { color: var(--rojo); }
    .num { font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Pruebas de los cálculos</h1>
    <p>Cada fila es un caso con su resultado esperado. Si todo sale en verde, los cálculos de <code>calculos.js</code> funcionan. <a href="./">Volver a Cinc</a></p>
    <p id="resumen" class="resumen">Calculando…</p>
    <table>
      <thead>
        <tr><th></th><th>Grupo</th><th>Caso</th><th>Obtenido</th><th>Esperado</th></tr>
      </thead>
      <tbody id="casos"></tbody>
    </table>
  </main>
  <script src="calculos.js"></script>
  <script src="pruebas.js"></script>
</body>
</html>
